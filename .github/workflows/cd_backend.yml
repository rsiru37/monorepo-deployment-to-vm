name: Deploy the BackendD
on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the Code
              uses: actions/checkout@v3

            - name: Login to Docker
              uses: docker/login-action@v4
              with:
                username: ${{secrets.DOCKERHUB_USERNAME}}
                password: ${{secrets.DOCKERHUB_TOKEN}}
            
            - name: Build and push ##This will first build the Image and them Deploy it to the Docker Hub
              uses: docker/build-push-action@v7
              with:
                context: . ## Context means from where do you want to build, We will build it from the root folder
                file: ./docker/Dockerfile.backend
                push: true
                tags: cryptingle/todo-backend:${{ github.sha }}
